  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {

    --text: #1F2937;

  body {

  }
  header {

    display: flex; align-items: center; justify-content: space-between;

  }
  header h1 {
    font-family: Georgia, 'Times New Roman', serif; font-size: 22px;
  }
  header .meta { font-size: 12px; opacity: 0.85; }
  header .week-picker {
    display: flex; align-items: center; gap: 6px;
  }
  header .week-picker select {
    padding: 6px 12px; border-radius: 6px; border: none;
    font-size: 13px; background: #fff; color: var(--navy);
  }
  .summary-bar {
    display: flex; gap: 16px; padding: 14px 24px; flex-wrap: wrap;
    background: #fff; border-bottom: 1px solid var(--border);
  }
  .summary-pill {
    padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
    letter-spacing: .3px;
  }
  .summary-pill.red { background: #FEE2E2; color: var(--red); }
  .summary-pill.amber { background: #FEF3C7; color: #B45309; }
  .summary-pill.green { background: #DCFCE7; color: #15803D; }
  .summary-pill.neutral { background: #F1F5F9; color: var(--slate); }
  .note-banner {
    margin: 12px 24px; padding: 12px 16px; background: #FEF3C7;
    border: 1px solid var(--amber); border-radius: 8px; font-size: 12px;
  }
  .note-banner strong { color: #B45309; }
  .section-title {
    font-family: Georgia, 'Times New Roman', serif; font-size: 19px;
    font-weight: bold; color: var(--navy); padding: 18px 24px 6px;
  }
  .section-subtitle { font-size: 11px; color: var(--slate); padding: 0 24px 12px; }
  .callout-card {
    margin: 0 24px 8px; border-radius: 8px; overflow: hidden;
    border: 1px solid var(--border);
  }
  .callout-card .card-head {
    padding: 8px 14px; color: #fff; font-size: 12px; font-weight: 700;
    letter-spacing: .5px;
  }
  .callout-card.completions .card-head { background: var(--green); }
  .callout-card.delays .card-head { background: var(--amber); }
  .callout-card.blockages .card-head { background: var(--red); }
  .callout-card ul {
    list-style: none; padding: 8px 14px; font-size: 12px;
  }
  .callout-card ul li { padding: 5px 0; border-bottom: 1px solid var(--border); }
  .callout-card ul li:last-child { border-bottom: none; }
  .callout-card .portco-tag {
    display: inline-block; padding: 1px 8px; border-radius: 10px;
    color: #fff; font-size: 10px; font-weight: 700; margin-right: 6px;
  }
  .action-row {
    display: grid; grid-template-columns: 80px 100px 1fr 130px; gap: 0;
    align-items: center; border: 1px solid var(--border); border-top: none;
    border-radius: 6px; margin: 0 24px 6px; overflow: hidden;
  }
  .action-row:first-of-type { border-top: 1px solid var(--border); }
  .action-row .priority {
    padding: 10px 6px 10px 12px; text-align: center;
  }
  .action-row .priority span {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    color: #fff; font-size: 10px; font-weight: 700;
  }
  .action-row .portco-name {
    padding: 10px 6px; font-size: 12px; font-weight: 700; color: var(--navy);
    border-right: 1px solid var(--border);
  }
  .action-row .action-desc { padding: 10px 10px; font-size: 12px; }
  .action-row .owner {
    padding: 10px 14px; font-size: 11px; font-weight: 700;
    color: var(--navy); text-align: right;
  }
  .pri-high { background: var(--red); }
  .pri-medium { background: var(--amber); }
  .pri-monitor { background: var(--navy); }
  .portco-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
    gap: 16px; padding: 8px 24px 24px;
  }
  @media (max-width: 480px) {
    .portco-grid { grid-template-columns: 1fr; }
  }
  .portco-card {
    background: #fff; border-radius: 8px; overflow: hidden;
    border: 1px solid var(--border);
  }
  .portco-card .card-header {
    background: var(--navy-light); padding: 10px 14px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 2px solid var(--amber);
  }
  .portco-card .card-header h2 {
    font-family: Georgia, 'Times New Roman', serif; font-size: 16px;
    color: var(--navy);
  }
  .portco-card .card-header .rag {
    padding: 3px 12px; border-radius: 10px; color: #fff;
    font-size: 11px; font-weight: 700; letter-spacing: .5px;
  }
  .rag-red { background: var(--red); } .rag-red-border { border-bottom-color: var(--red); }
  .rag-amber { background: var(--amber); } .rag-amber-border { border-bottom-color: var(--amber); }
  .rag-green { background: var(--green); } .rag-green-border { border-bottom-color: var(--green); }
  .portco-card .card-source {
    padding: 4px 14px; font-size: 10px; color: var(--slate);
    font-style: italic;
  }
  .portco-card table {
    width: 100%; border-collapse: collapse; font-size: 11px;
  }
  .portco-card table th {
    background: var(--navy); color: #fff; font-weight: 700;
    padding: 5px 6px; text-align: left; font-size: 10px; letter-spacing: .3px;
  }
  .portco-card table td {
    padding: 5px 6px; border: 1px solid var(--border); vertical-align: top;
  }
  .portco-card table td.rag-cell {
    text-align: center; font-weight: 700; color: #fff; width: 28px;
  }
  .portco-card table tr:nth-child(even) td { background: #F8FAFC; }
  .portco-card .win-blocker-row {
    display: flex; gap: 0;
  }
  .portco-card .win-box, .portco-card .blocker-box {
    flex: 1; padding: 8px 10px; font-size: 11px;
  }
  .portco-card .win-box {
    background: #DCFCE7; border: 1px solid var(--green);
  }
  .portco-card .blocker-box {
    background: #FEE2E2; border: 1px solid var(--red);

  .portco-card .win-box h3 { color: var(--green); font-size: 11px; letter-spacing: .5px; margin-bottom: 4px; }
  .portco-card .blocker-box h3 { color: var(--red); font-size: 11px; letter-spacing: .5px; margin-bottom: 4px; }
  .portco-card ul { margin: 0; padding-left: 16px; font-size: 11px; }
  .portco-card ul li { margin-bottom: 3px; }
  .footer {
    padding: 18px 24px; font-size: 11px; color: var(--slate);
    border-top: 2px solid var(--border); text-align: right;
  }
</style>

let currentWeek = "2026-09-04";

function pickWeek() {
  const sel = document.getElementById("weekSelect");
  if (sel.value) {
    currentWeek = sel.value;
    render(reports[currentWeek]);
  }
}

function render(r) {
  if (!r) return;
  document.getElementById("weekLabel").textContent =
    "Week ending " + r.weekEnding + " · data current to " + r.dataCurrent;

  const sb = document.getElementById("summaryBar");
  sb.innerHTML = "";
  if (r.summary.red > 0) sb.innerHTML += '<span class="summary-pill red">' + r.summary.red + ' RED</span>';
  if (r.summary.amber > 0) sb.innerHTML += '<span class="summary-pill amber">' + r.summary.amber + ' AMBER</span>';
  if (r.summary.green > 0) sb.innerHTML += '<span class="summary-pill green">' + r.summary.green + ' GREEN</span>';
  sb.innerHTML += '<span class="summary-pill neutral">' + r.summary.total + ' portcos</span>';

  document.getElementById("noteBanner").innerHTML = r.note;
  document.getElementById("calloutDate").textContent = "Week ending " + r.weekEnding;

  let co = "";
  co += '<div class="callout-card completions"><div class="card-head">COMPLETIONS</div><ul>';
  r.completions.forEach(function(c) {
    co += '<li><span class="portco-tag" style="background:var(--navy)">' + c.portco + '</span>' + c.text + '</li>';
  });
  co += '</ul></div>';

  co += '<div class="callout-card delays"><div class="card-head">DELAYS</div><ul>';
  r.delays.forEach(function(d) {
    co += '<li><span class="portco-tag" style="background:var(--amber)">' + d.portco + '</span>' + d.text + '</li>';
  });
  co += '</ul></div>';

  co += '<div class="callout-card blockages"><div class="card-head">BLOCKAGES</div><ul>';
  r.blockages.forEach(function(b) {
    co += '<li><span class="portco-tag" style="background:var(--red)">' + b.portco + '</span>' + b.text + '</li>';
  });
  co += '</ul></div>';
  document.getElementById("callouts").innerHTML = co;

  let ac = "";
  r.actions.forEach(function(a) {
    var priCls = a.pri === "HIGH" ? "pri-high" : a.pri === "MEDIUM" ? "pri-medium" : "pri-monitor";
    ac += '<div class="action-row"><div class="priority"><span class="' + priCls + '">' + a.pri + '</span></div><div class="portco-name">' + a.portco + '</div><div class="action-desc">' + a.desc + '</div><div class="owner">' + a.owner + '</div></div>';
  });
  document.getElementById("actions").innerHTML = ac;

  const grid = document.getElementById("portcoGrid");
  let pc = "";
  r.portcos.forEach(function(p) {
    var ragCls = p.rag === "RED" ? "rag-red" : p.rag === "AMBER" ? "rag-amber" : "rag-green";
    var borderCls = ragCls + "-border";
    pc += '<div class="portco-card">';
    pc += '<div class="card-header ' + borderCls + '"><h2>' + p.name + '</h2><span class="rag ' + ragCls + '">' + p.rag + '</span></div>';
    pc += '<div class="card-source">' + p.source + '</div>';
    pc += '<table><thead><tr><th>Project</th><th>Status</th><th>Assignee</th><th>ETA</th><th>RAG</th><th>Notes</th></tr></thead><tbody>';
    p.rows.forEach(function(row) {
      var rCls = row.rag === "G" ? "background:#16A34A;color:#fff" : row.rag === "A" ? "background:#F59E0B;color:#fff" : "background:#DC2626;color:#fff";
      pc += '<tr><td style="font-weight:600">' + row.proj + '</td><td>' + row.status + '</td><td>' + row.assignee + '</td><td>' + row.eta + '</td><td class="rag-cell" style="' + rCls + '">' + row.rag + '</td><td style="font-size:10px">' + row.notes + '</td></tr>';
    });
    pc += '</tbody></table>';
    pc += '<div class="win-blocker-row">';
    pc += '<div class="win-box"><h3>THIS PERIOD\'S WINS</h3><ul>';
    if (p.wins.length === 0) {
      pc += '<li style="color:var(--slate);font-style:italic">No wins logged this period</li>';
    } else {
      p.wins.forEach(function(w) { pc += '<li>' + w + '</li>'; });
    }
    pc += '</ul></div>';
    pc += '<div class="blocker-box"><h3>WATCH ITEMS / BLOCKERS</h3><ul>';
    if (p.blockers.length === 0) {
      pc += '<li style="color:var(--slate);font-style:italic">No blockers logged</li>';
    } else {
      p.blockers.forEach(function(b) { pc += '<li>' + b + '</li>'; });
    }
    pc += '</ul></div>';
    pc += '</div></div>';
  });
  grid.innerHTML = pc;
}

document.addEventListener("DOMContentLoaded", function() {
  var sel = document.getElementById("weekSelect");
  Object.keys(reports).sort().reverse().forEach(function(k) {
    sel.innerHTML += '<option value="' + k + '">Week ending ' + reports[k].weekEnding + '</option>';
  });
  sel.value = currentWeek;
  render(reports[currentWeek]);
});
